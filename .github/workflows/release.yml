name: publication-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
      MFQ_SKIP_LATEX: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - name: Install MiKTeX with bounded retry
        shell: pwsh
        run: tools/install_miktex_ci.ps1
      - run: uv sync
      - run: uv run python tools/build_release.py --vendored-template-only
        env:
          MFQ_RELEASE_TAG: ${{ github.ref_name }}
          MFQ_MIKTEX_AUTO_INSTALL: "1"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} — 视觉与笔面试训练增强版
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            output/pdf/math-for-quant-upper.pdf
            output/pdf/math-for-quant-solutions.pdf
            output/pdf/math-for-quant-lower.pdf
            output/math-for-quant-notebooks.zip
            output/release/release-manifest.json
