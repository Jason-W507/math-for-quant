name: publication-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install MiKTeX with bounded retry
        shell: pwsh
        run: tools/install_miktex_ci.ps1
      - name: Verify tag matches VERSION
        shell: pwsh
        run: |
          $version = (Get-Content VERSION -Raw).Trim()
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "tag ${{ github.ref_name }} does not match VERSION v$version"
          }
      - name: Build three PDFs with latexmk
        run: python tools/build_books.py --volume all
        env:
          MFQ_MIKTEX_AUTO_INSTALL: "1"
      - uses: softprops/action-gh-release@v2
        with:
          name: ${{ github.ref_name }} — 视觉与笔面试训练增强版
          body_path: docs/releases/${{ github.ref_name }}.md
          files: |
            output/pdf/math-for-quant-upper.pdf
            output/pdf/math-for-quant-solutions.pdf
            output/pdf/math-for-quant-lower.pdf
