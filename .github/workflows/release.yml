name: publication-release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: choco install miktex --no-progress -y
      - run: uv sync
      - run: uv run python -m unittest discover -s tests
      - run: uv run python tools/build_books.py --volume all
      - uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            output/pdf/math-for-quant-upper.pdf
            output/pdf/math-for-quant-upper-solutions.pdf
            output/pdf/math-for-quant-lower.pdf
