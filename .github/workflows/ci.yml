name: curriculum-ci

on:
  push:
  pull_request:

jobs:
  python:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        python: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: ${{ matrix.python }}
      - run: uv sync
      - run: uv run python tools/render_shared_registries.py --check
      - run: uv run python -m unittest discover -s tests

  publication:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
        with:
          python-version: "3.13"
      - run: choco install miktex --no-progress -y
      - run: uv sync
      - run: uv run python tools/build_books.py --volume all
      - run: uv run python tools/check_pdf_visual_regression.py
      - uses: actions/upload-artifact@v4
        with:
          name: math-for-quant-publications
          path: |
            output/pdf/math-for-quant-upper.pdf
            output/pdf/math-for-quant-lower.pdf
            output/pdf/math-for-quant-solutions.pdf
