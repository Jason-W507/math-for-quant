name: Editorial source snapshot (temporary)

on:
  push:
    branches: [editorial/textbook-prose-20260909]
    paths: [.github/workflows/editorial-source-snapshot.yml]

permissions:
  contents: read

jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read staged editorial transfer
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import urllib.request, os, json, base64, lzma
          u='https://api.github.com/repos/Jason-W507/math-for-quant/git/blobs/f2c3e46d7028c791c2564c90bc834c2626ead491'
          req=urllib.request.Request(u,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
          with urllib.request.urlopen(req) as r: b=json.load(r)
          raw=base64.b64decode(b['content'])
          open('staged-transfer.part1','wb').write(raw)
          d=lzma.LZMADecompressor()
          prefix=d.decompress(raw)
          open('staged-transfer-prefix.txt','wb').write(prefix)
          print('Retrieved',len(raw),'bytes;',len(prefix),'decoded bytes')
          PY
      - name: Make staged transfer available for verification
        uses: actions/upload-artifact@v4
        with:
          name: editorial-staged-transfer
          path: |
            staged-transfer.part1
            staged-transfer-prefix.txt
          retention-days: 1

# Temporary review helper; removed before the manuscript PR.
