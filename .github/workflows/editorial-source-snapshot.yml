name: Apply verified editorial review (temporary)

on:
  push:
    branches: [editorial/textbook-prose-20260909]
    paths: [.github/workflows/editorial-source-snapshot.yml]

permissions:
  contents: write

concurrency:
  group: editorial-textbook-prose-20260909
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          ref: editorial/textbook-prose-20260909
          fetch-depth: 0
      - name: Apply fixed-revision editorial changes with content verification
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python - <<'PY'
          import base64, hashlib, json, lzma, os, pathlib, subprocess, urllib.request
          root=pathlib.Path.cwd()
          base='20eceb7c287719cd97fa2e4177d24ad1646b70f9'
          def blob(sha):
              url='https://api.github.com/repos/Jason-W507/math-for-quant/git/blobs/'+sha
              request=urllib.request.Request(url,headers={'Authorization':'Bearer '+os.environ['GH_TOKEN'],'Accept':'application/vnd.github+json'})
              with urllib.request.urlopen(request) as response: value=json.load(response)
              raw=base64.b64decode(value['content'])
              assert hashlib.sha1(('blob '+str(len(raw))+'\0').encode()+raw).hexdigest()==sha
              return raw
          first=blob('f2c3e46d7028c791c2564c90bc834c2626ead491')
          prefix=lzma.LZMADecompressor().decompress(first).decode('utf-8',errors='ignore')
          pos=prefix.index('"edits":{')+9
          decoder=json.JSONDecoder()
          prior={}
          while pos<len(prefix):
              try:
                  key,end=decoder.raw_decode(prefix,pos)
                  pos=end+1
                  value,end=decoder.raw_decode(prefix,pos)
                  prior[key]=value
                  pos=end+1
              except json.JSONDecodeError:
                  break
          assert len(prior)==43
          remaining=b''.join(blob(sha) for sha in [
              '051f67f8fdd771c28b3b2ae56edc326270c26f38',
              '7ff677d6cd0df1e3459aad3a9ad5e7fb35019a82',
              '1f4bccd3f828de204577ae5449e99f490e6ba96e'])
          assert hashlib.sha256(remaining).hexdigest()=='4d43927e5c28190449196d184db2981b2d769989f494bc01f0aaebd1b393f82e'
          delta=json.loads(lzma.decompress(remaining))
          assert delta['base']==base
          assert len(delta['files'])==138
          old_hash=hashlib.sha256()
          new_hash=hashlib.sha256()
          pending={}
          def apply(text,edits):
              previous=len(text)
              for start,end,value in reversed(edits):
                  assert 0<=start<=end<=previous
                  text=text[:start]+value+text[end:]
                  previous=start
              return text
          for filename in delta['files']:
              path=pathlib.PurePosixPath(filename)
              assert not path.is_absolute() and '..' not in path.parts and '.git' not in path.parts
              assert path.parts[0] in {'CONTEXT.md','README.md','curriculum','docs','figures','notebooks','tex','tools'}
              read=subprocess.run(['git','show',base+':'+filename],capture_output=True)
              text=read.stdout.decode('utf-8') if read.returncode==0 else ''
              if filename in prior: text=apply(text,prior[filename])
              old_hash.update(filename.encode()+b'\0'+text.encode()+b'\0')
              if filename in delta['edits']: text=apply(text,delta['edits'][filename])
              new_hash.update(filename.encode()+b'\0'+text.encode()+b'\0')
              pending[filename]=text
          assert old_hash.hexdigest()==delta['old']
          assert new_hash.hexdigest()==delta['new']=='d40f3b7d748510866fdee1845ce2ffc7eda2387ae49fe5b33cd76bf7790a088d'
          for filename,text in pending.items():
              path=root/filename
              path.parent.mkdir(parents=True,exist_ok=True)
              path.write_text(text,encoding='utf-8')
          subprocess.run(['python','tools/build_course_assets.py','--check'],check=True)
          subprocess.run(['git','diff','--check'],check=True)
          subprocess.run(['git','add','--',*pending],check=True)
          subprocess.run(['git','config','user.name','github-actions[bot]'],check=True)
          subprocess.run(['git','config','user.email','41898282+github-actions[bot]@users.noreply.github.com'],check=True)
          subprocess.run(['git','commit','-m','docs: revise textbook exposition, examples and exercise explanations'],check=True)
          subprocess.run(['git','push','origin','HEAD:editorial/textbook-prose-20260909'],check=True)
          print('Verified and committed',len(pending),'edited files; main unchanged.')
          PY

# Temporary transport helper; removed before opening the manuscript PR.
