[project]
name = "math-for-quant"
version = "0.2.0"
description = "Executable evidence and publication pipeline for Quantitative Research Mathematics"
requires-python = ">=3.11,<3.14"
dependencies = [
    "jupytext>=1.16,<2",
    "ipykernel>=7,<8",
    "nbclient>=0.10,<1",
    "pypdf>=6,<7",
    "pymupdf>=1.26,<2",
    "numpy==2.3.5; python_version < '3.12'",
    "numpy==2.5.1; python_version >= '3.12'",
    "jsonschema>=4.23,<5",
    "matplotlib>=3.9,<4",
    "scikit-learn>=1.5,<2",
    "statsmodels>=0.14,<1",
]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/math_for_quant"]

[tool.uv]
package = true
