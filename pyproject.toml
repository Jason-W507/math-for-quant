[project]
name = "math-for-quant"
version = "0.1.0"
description = "Executable evidence and publication pipeline for Quantitative Research Mathematics"
requires-python = ">=3.11,<3.14"
dependencies = [
    "jupytext>=1.16,<2",
    "ipykernel>=7,<8",
    "nbclient>=0.10,<1",
    "pypdf>=6,<7",
    "numpy==2.3.5; python_version < '3.12'",
    "numpy==2.5.1; python_version >= '3.12'",
    "jsonschema>=4.23,<5",
]

[tool.uv]
package = false
